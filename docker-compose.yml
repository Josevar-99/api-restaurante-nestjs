x-db-env: &db-env
  TZ: America/Bogota
  POSTGRES_HOST: postgres
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - restaurant_db_nest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-api:local
    command: ['npm', 'run', 'migration:run:prod']
    restart: 'no'
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  restaurant-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-api:local
    restart: unless-stopped
    ports:
      - '${PORT}:${PORT}'
    environment:
      <<: *db-env
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  restaurant_db_nest_postgres_data:
